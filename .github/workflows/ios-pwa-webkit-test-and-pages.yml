name: iOS PWA WebKit test and Pages
on:
  push:
    branches: [ios-pwa]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'ios-pwa-runtime.js'
      - 'prepare_ios_pwa.py'
      - 'ios_webkit_test.js'
      - '.github/workflows/ios-pwa-webkit-test-and-pages.yml'
      - 'icons/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  webkit-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: WebKitとアイコン生成ツールを準備
        run: npm install --no-save playwright@1.56.0 sharp@0.33.5
      - name: iPhone向けHTMLを準備
        run: python3 prepare_ios_pwa.py
      - name: PNGアイコンを生成
        run: node icons/generate_icons.js
      - name: 配信用ファイルがそろっているか
        run: |
          for f in index.html manifest.webmanifest sw.js ios-pwa-runtime.js icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png; do test -s "$f" || { echo "MISSING $f"; exit 1; }; done
          grep -q 'id="iosWake"\|iosWake' ios-pwa-runtime.js
      - run: npx playwright install --with-deps webkit
      - name: WebKitテスト
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pwa-server.log 2>&1 &
          sleep 2
          node ios_webkit_test.js
      - name: ios-pwaに生成済みindexとPNGアイコンを保存
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Build iPhone PWA v35 distribution files [skip ci]"
            git push origin HEAD:ios-pwa
          fi
  deploy:
    needs: webkit-test
    if: ${{ needs.webkit-test.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages-ios-pwa
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: アイコン生成ツールを準備
        run: npm install --no-save sharp@0.33.5
      - name: iPhone向けHTMLを準備
        run: python3 prepare_ios_pwa.py
      - name: PNGアイコンを生成
        run: node icons/generate_icons.js
      - uses: actions/configure-pages@v5
      - name: 配信するファイルだけを集める
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js ios-pwa-runtime.js _site/
          cp -r icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
