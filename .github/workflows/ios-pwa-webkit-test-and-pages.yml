name: iOS PWA WebKit test and Pages
on:
  push:
    branches: [ios-pwa]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  webkit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps webkit
      - run: python3 -m http.server 8765 --directory . >/tmp/pwa-server.log 2>&1 &
      - run: sleep 2 && node ios_webkit_test.js
  deploy:
    needs: webkit-test
    if: ${{ needs.webkit-test.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
