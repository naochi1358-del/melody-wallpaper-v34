name: iOS PWA WebKit test and Pages
on:
  push:
    branches: [ios-pwa]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  webkit-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 配信用ファイルがそろっているか
        run: |
          for f in index.html manifest.webmanifest sw.js icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png; do test -s "$f" || { echo "MISSING $f"; exit 1; }; done
          grep -q 'id="iosWake"\|iosWake' index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps webkit
      - name: WebKitテスト（サーバー起動とテストを同じ手順内で）
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pwa-server.log 2>&1 &
          sleep 2
          node ios_webkit_test.js
  deploy:
    needs: webkit-test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 配信するファイルだけを集める
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
